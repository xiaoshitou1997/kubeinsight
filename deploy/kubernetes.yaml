# KubeInsight — in-cluster deployment
#
#   kubectl apply -f deploy/kubernetes.yaml
#   kubectl -n kubeinsight get secret kubeinsight-auth -o jsonpath='{.data.token}' | base64 -d; echo
#   kubectl -n kubeinsight port-forward svc/kubeinsight 8090:8090
#
# Replace the Secret token before exposing the Service.
# The image below is a placeholder: build/push your own and update `image`.

apiVersion: v1
kind: Namespace
metadata:
  name: kubeinsight
  labels:
    app.kubernetes.io/name: kubeinsight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeinsight
  namespace: kubeinsight
  labels:
    app.kubernetes.io/name: kubeinsight
---
apiVersion: v1
kind: Secret
metadata:
  name: kubeinsight-auth
  namespace: kubeinsight
type: Opaque
stringData:
  token: change-me
---
# Cluster-wide management permissions. For a read-only deployment, replace the
# verbs below with ["get", "list", "watch"] and set KUBEINSIGHT_READ_ONLY=1.
# Restrict this ClusterRole if you only need a subset of resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeinsight
  labels:
    app.kubernetes.io/name: kubeinsight
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - namespaces
      - nodes
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - limitranges
      - resourcequotas
      - replicationcontrollers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["selfsubjectreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeinsight
  labels:
    app.kubernetes.io/name: kubeinsight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeinsight
subjects:
  - kind: ServiceAccount
    name: kubeinsight
    namespace: kubeinsight
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeinsight
  namespace: kubeinsight
  labels:
    app.kubernetes.io/name: kubeinsight
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeinsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeinsight
    spec:
      serviceAccountName: kubeinsight
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeinsight
          image: ghcr.io/kubeinsight/kubeinsight:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8090"
            - name: KUBEINSIGHT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubeinsight-auth
                  key: token
            - name: KUBEINSIGHT_LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeinsight
  namespace: kubeinsight
  labels:
    app.kubernetes.io/name: kubeinsight
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubeinsight
  ports:
    - name: http
      port: 8090
      targetPort: http
---
# Optional: expose through an Ingress. Terminate TLS and add authentication
